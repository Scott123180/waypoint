<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Top three</title>
    <style>
      /*
        The same five tokens the capture box, the sort view and the projects
        view use, verbatim. Four windows, one tool (Principle VII).
      */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #d8d8d8;
        --error: #a4262c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #9a9a9a;
          --border: #3a3a3a;
          --error: #ff9a9a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow-y: auto;
        padding: 20px 24px;
      }

      h1 { font-size: 17px; margin: 0 0 2px; }
      .week-id { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

      ul { list-style: none; margin: 0; padding: 0; }

      li.outcome {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      li.outcome:last-child { border-bottom: none; }
      li.outcome .text { flex: 1; word-break: break-word; }
      li.outcome.done .text { color: var(--muted); text-decoration: line-through; }
      li.outcome .date { color: var(--muted); font-size: 12px; white-space: nowrap; }

      button {
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      button.link {
        border: none;
        color: var(--muted);
        padding: 2px 4px;
      }

      #add-row { display: flex; gap: 8px; margin-top: 14px; }
      #add-text {
        flex: 1;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
      }

      #error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 1.2em; }
      #empty { color: var(--muted); padding: 10px 0; }

      /* ------------------------------------------------------------ past -- */
      h2 { font-size: 14px; margin: 26px 0 4px; color: var(--muted); font-weight: 600; }
      .past { border-top: 1px solid var(--border); margin-top: 24px; padding-top: 4px; }
      .past li.outcome { border-bottom: none; padding: 3px 0; }
      .past .text { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Top three</h1>
    <div class="week-id" id="week-id"></div>

    <div id="empty" hidden>Nothing set for this week yet. What are the one to three outcomes that matter most?</div>
    <ul id="current"></ul>

    <div id="add-row">
      <input id="add-text" type="text" placeholder="An outcome that matters this week" />
      <button id="add">Add</button>
    </div>

    <div id="error" role="alert"></div>

    <div class="past" id="past-section" hidden>
      <div id="past"></div>
    </div>

    <script src="./top-three.js"></script>
  </body>
</html>

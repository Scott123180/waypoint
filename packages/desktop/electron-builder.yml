appId: dev.waypoint.app
productName: Waypoint
copyright: Waypoint

# No native modules anywhere in the tree, so there is nothing to rebuild. The
# step is disabled because it runs `npm install --production` inside the app
# directory, which in an npm workspace prunes the hoisted devDependencies — up
# to and including electron-builder's own app-builder binary, mid-build.
npmRebuild: false

# Resolved relative to the working directory, *not* to --projectDir or to this
# file — hence the repo-root path. `npm run package` always runs from the root.
afterPack: scripts/after-pack.js

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - build/trayTemplate*.png
  - package.json
  - "!dist/tests/**"
  - "!**/*.map"
  # Note: core's compiled tests still ship. electron-builder copies symlinked
  # workspace dependencies wholesale, and honours neither a `files` negation
  # here nor a `files` field in core's own package.json — all three were tried
  # against a real build. ~30KB inside a 555MB artifact, so it is left alone
  # rather than restructuring core's build output to work around it.

extraMetadata:
  main: dist/src/main/main.js

# The whisper binary and model ship inside the artifact rather than being
# downloaded on first run: voice is core functionality, and the constitution
# forbids core functionality depending on the network.
extraResources:
  - from: ../../resources/whisper
    to: whisper
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch: [arm64]
    # Some networks block .dmg downloads by file extension. The zip carries the
    # same Waypoint.app, and has the side benefit of needing no disk image
    # mounted — unzip and drag.
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # Background agent: no dock icon, summoned by hotkey or the menu-bar item.
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: >-
      Waypoint transcribes your dictated thoughts on this device. Audio is never
      recorded to disk and never leaves your Mac.
  # Developer ID signing and notarization are deliberately deferred. The bundle
  # is still ad-hoc signed by after-pack.js, because Apple Silicon will not run
  # an unsigned arm64 binary at all — without it macOS reports the app as
  # "damaged", which right-click → Open cannot get past.
  identity: null

linux:
  # Scoped to Linux deliberately. Without it the executable is named after the
  # package (`@waypoint/desktop`), giving `@waypointdesktop` — a leading `@` the
  # AppImage launcher cannot exec. Setting it globally also renamed the macOS
  # bundle to `waypoint.app`, so Finder showed a lowercase name next to
  # "Waypoint Helper.app"; macOS takes its name from productName instead.
  executableName: waypoint
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  synopsis: Local-first, plain-text capture

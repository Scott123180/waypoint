name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Core + adapter tests. These use fakes and a fake whisper-cli script, so
      # they need neither Electron nor the ~500MB model.
      - name: Unit and contract tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright drives a real Electron window, which needs a display on a
      # headless runner. Latency numbers from a VM are a regression signal only;
      # the authoritative <100ms measurement is on real hardware (quickstart §2).
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
